#
# aix-user: a public-domain PoC/attempt to run 32-bit AIX binaries
# on Linux via Unicorn, same idea as 'qemu-user', but for AIX+PPC
# Made by Theldus, 2025-2026
#

name: CI

env:
  AIX_LIB: ${{ secrets.AIX_LIB }}

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - '.gdbinit'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Build and test aix-user
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache AIX libs
      id: cache-aix-libs
      uses: actions/cache@v5
      with:
        path: |
          .libs72
          .libs73
        key: aix-libs-v1

    - name: Setup AIX libs
      if: steps.cache-aix-libs.outputs.cache-hit != 'true'
      run: |
        pwd
        mkdir .deps
        mkdir .libs72
        mkdir .libs73
        wget -q $AIX_LIB -O .deps/aix-libs.tar.gz
        tar xvf .deps/aix-libs.tar.gz -C .deps/
        mv .deps/aix_7.2_7.3/7.2_TL04/libs/*     .libs72
        mv .deps/aix_7.2_7.3/7.3_TL03_SP2/libs/* .libs73

    - name: Resolve Unicorn submodule commit
      id: unicorn-rev
      run: |
        SHA=$(git rev-parse HEAD:unicorn)
        echo "Pinned unicorn commit: $SHA"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Cache Unicorn build
      id: cache-unicorn
      uses: actions/cache@v5
      with:
        path: .deps-unicorn
        key: unicorn-${{ runner.os }}-${{ steps.unicorn-rev.outputs.sha }}

    - name: Build and run tests (AIX 7.2)
      run: AIX_USER_LIB_PATH=$PWD/.libs72 make tests

    - name: Run tests (AIX 7.3)
      run: AIX_USER_LIB_PATH=$PWD/.libs73 make tests
