#
# aix-user: a public-domain PoC/attempt to run 32-bit AIX binaries
# on Linux via Unicorn, same idea as 'qemu-user', but for AIX+PPC
# Made by Theldus, 2025
#

name: CI

env:
  AIX_LIB: https://archive.org/download/coreutils_7.2_tl04_sp2.tar/coreutils_7.2_tl04_sp2.tar.gz
  PKG_CONFIG_PATH: /home/runner/work/aix-user/aix-user/.deps-unicorn/lib/pkgconfig/
  LD_LIBRARY_PATH: /home/runner/work/aix-user/aix-user/.deps-unicorn/lib/

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - '.gdbinit'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Build and test aix-user
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup AIX libs
      run: |
        pwd
        echo "pkgconfig: $PKG_CONFIG_PATH"
        echo "ldconfig: $LD_LIBRARY_PATH"
        mkdir .deps
        mkdir .libs
        wget $AIX_LIB -O .deps/aix-libs.tar.gz 
        tar xvf .deps/aix-libs.tar.gz -C .deps/
        cp .deps/coreutils_7.2_tl04_sp2/libs/* .libs

    - name: Resolve Unicorn fork commit
      id: unicorn-rev
      run: |
        SHA=$(git ls-remote https://github.com/Theldus/unicorn.git aix-user | cut -f1)
        echo "Latest aix-user commit: $SHA"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Cache Unicorn build
      id: cache-unicorn
      uses: actions/cache@v4
      with:
        path: .deps-unicorn
        key: unicorn-${{ runner.os }}-${{ steps.unicorn-rev.outputs.sha }}

    - name: Build Unicorn from fork
      if: steps.cache-unicorn.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch aix-user \
          https://github.com/Theldus/unicorn.git unicorn-src
        cd unicorn-src
        cmake -B build \
          -DUNICORN_ARCH=ppc \
          -DCMAKE_BUILD_TYPE=Release \
          -DUNICORN_BUILD_TESTS=OFF \
          -DCMAKE_INSTALL_LIBDIR=lib \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.deps-unicorn"
        cmake --build build -j"$(nproc)"
        cmake --install build

    - name: Build and run tests
      run: make test
