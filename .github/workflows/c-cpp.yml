#
# aix-user: a public-domain PoC/attempt to run 32-bit AIX binaries
# on Linux via Unicorn, same idea as 'qemu-user', but for AIX+PPC
# Made by Theldus, 2025-2026
#

name: CI

env:
  AIX_LIB: https://archive.org/download/coreutils_7.2_tl04_sp2.tar/coreutils_7.2_tl04_sp2.tar.gz

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - '.gdbinit'
      - '.gitignore'
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Build and test aix-user
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup AIX libs
      run: |
        pwd
        mkdir .deps
        mkdir .libs
        wget $AIX_LIB -O .deps/aix-libs.tar.gz 
        tar xvf .deps/aix-libs.tar.gz -C .deps/
        cp .deps/coreutils_7.2_tl04_sp2/libs/* .libs

    - name: Resolve Unicorn submodule commit
      id: unicorn-rev
      run: |
        SHA=$(git rev-parse HEAD:unicorn)
        echo "Pinned unicorn commit: $SHA"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Cache Unicorn build
      id: cache-unicorn
      uses: actions/cache@v4
      with:
        path: .deps-unicorn
        key: unicorn-${{ runner.os }}-${{ steps.unicorn-rev.outputs.sha }}

    - name: Build and run tests
      run: make test
